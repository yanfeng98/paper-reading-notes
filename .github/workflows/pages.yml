name: Build and deploy reading notes

# GitHub Actions is the only supported full-site deployment. It builds
# site/ + notes/ + docs/ into _site/ and uploads that artifact to Pages.
# Branch deployment (main /docs) is retired: docs/index.html and docs/assets
# were removed when the library reader moved to site/.
#
# First-time setup (required once): Settings → Pages → Source = "GitHub Actions".
# The workflow builds and validates on every relevant push even when Pages is
# not enabled; deployment steps are skipped with a notice in that case.

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "docs/**"
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 与 GitHub 官方 Pages 模板一致：让正在进行的部署跑完，避免旧版本被半途取消。
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || format('https://github.com/{0}', github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build before the Pages guard so README/notes/link validation always runs.
      - name: Build static site
        run: python3 site/build.py --out _site

      - id: pages
        name: Check Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages 尚未启用。请在 Settings → Pages 选择 GitHub Actions。"
          elif [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages 当前是分支部署（build_type=$build_type）；完整笔记库只支持 GitHub Actions，请在 Settings → Pages 切换 Source。"
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
